{% load static %}<!DOCTYPE html>
<html lang="{{ lang }}" class="no-js">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.remove("no-js");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0C">

  <title>{% block title %}{{ t.meta_title }}{% endblock %}</title>
  <meta name="description" content="{{ t.meta_description }}">
  <meta name="author" content="{{ profile.name }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ t.meta_title }}">
  <meta property="og:description" content="{{ t.meta_description }}">
  <meta property="og:image" content="{% static profile.photo %}">
  <meta property="og:locale" content="{% if lang == 'es' %}es_CO{% else %}en_US{% endif %}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="alternate" hreflang="{{ t.other_lang }}" href="{{ other_lang_url }}">
  <link rel="icon" type="image/jpeg" href="{% static profile.photo %}">
  <link rel="apple-touch-icon" href="{% static profile.photo %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">{% if lang == 'es' %}Ir al contenido{% else %}Skip to content{% endif %}</a>

  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  {% include "main/partials/nav.html" %}

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  {% include "main/partials/footer.html" %}

  <script src="{% static 'js/main.js' %}" defer></script>
</body>
</html>
